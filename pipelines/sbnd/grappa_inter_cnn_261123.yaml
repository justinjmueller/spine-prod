# Standalone SBND interaction GrapPA with sparse CNN encoders, trained from
# scratch next to its geometric-feature reference on identical events. Supply
# its destination with CLI --workspace.
#
# Both trainers read labeled LArCV voxels and build truth particle groups,
# graphs and features live; nothing is cached. Precomputed particle-graph
# features bypass the encoders, so they cannot train a CNN. The two variants
# differ only in their node/edge encoders and the GNN input widths, so the
# comparison is one-to-one. This first revision checks that the CNN model runs
# and measures its loading/model cost before caching static inputs for
# hyper-parameter scans.

workspace: null

variables:
  train_source_list: /lus/eagle/projects/neutrinoGPU/jmueller/spine_train/datasets/v10_14_02/mixed/train/files.txt
  validation_source_list: /lus/eagle/projects/neutrinoGPU/jmueller/spine_train/datasets/v10_14_02/mixed/test/files.txt
  filter_cache_dir: ${workspace}/filter/counts

collections:
  splits:
    - name: train
      source_list: ${train_source_list}
    - name: validation
      source_list: ${validation_source_list}

defaults:
  profile: anl_polaris_capacity_full
  time: "72:00:00"

stages:
  # Measure raw product sizes once per source, reusing compatible scan records.
  - name: scan_${split.name}_filter
    time: "00:30:00"
    for_each:
      collection: splits
      as: split
    kind: filter
    operation: scan
    config: filter/sbnd/space_points_261029.yaml
    source_list: ${split.source_list}
    cache_dir: ${filter_cache_dir}
    run_dir: ${workspace}/filter/${split.name}/scan
    profile: anl_polaris_cpu
    cpus_per_task: 16
    workers: 16

  # Build file-aware manifests accepting events with fewer than 500k points.
  - name: build_${split.name}_filter
    time: "00:10:00"
    for_each:
      collection: splits
      as: split
    kind: filter
    operation: build
    depends_on: ["scan_${split.name}_filter"]
    config: filter/sbnd/space_points_261029.yaml
    source_list: ${split.source_list}
    cache_dir: ${filter_cache_dir}
    output: ${workspace}/filter/${split.name}/accepted.yaml
    output_source_list: ${workspace}/filter/${split.name}/accepted_files.txt
    run_dir: ${workspace}/filter/${split.name}/build
    profile: anl_polaris_cpu

  # Reference: human-engineered geometric node/edge features.
  - name: train_grappa_inter_geo
    depends_on: [build_train_filter, build_validation_filter]
    config: train/sbnd/grappa_inter/train_261123_geo.yaml
    stage: train
    # Namespace map only: weights load solely when launched with --warm-start
    warm_start:
      grappa: grappa_inter
    source_list: ${train_source_list}
    val_source_list: ${validation_source_list}
    entry_filter: ${workspace}/filter/train/accepted.yaml
    val_entry_filter: ${workspace}/filter/validation/accepted.yaml
    val_entry_fraction_range: [0.0, 0.5]
    run_dir: ${workspace}/train/grappa_inter_geo
    tensorboard: true

  # Sparse CNN node/edge encoders with lattice-phase augmentation.
  - name: train_grappa_inter_cnn
    depends_on: [build_train_filter, build_validation_filter]
    config: train/sbnd/grappa_inter/train_261123_cnn.yaml
    stage: train
    source_list: ${train_source_list}
    val_source_list: ${validation_source_list}
    entry_filter: ${workspace}/filter/train/accepted.yaml
    val_entry_filter: ${workspace}/filter/validation/accepted.yaml
    val_entry_fraction_range: [0.0, 0.5]
    run_dir: ${workspace}/train/grappa_inter_cnn
    tensorboard: true
